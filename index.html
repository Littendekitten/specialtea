<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecialTea Ratings</title>
  <!-- Google Font - Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Base Colors */
      --bg-light: #1e2229;
      --bg-dark: #121417;
      --card-bg: #1e2229;
      --text: #e0e6ed;
      --subtext: #9da8b6;

      /* Tier Colors & Glows */
      --common: #a0a0a0;
      --uncommon: #2ecc71;
      --rare: #3498db;
      --epic: #9b59b6;
      --mythical: #e67e22;
      --legendary: #f1c40f;
      --catgendary: #ff007f;

      --glow-rare: 0 0 10px rgba(52, 152, 219, 0.2);
      --glow-epic: 0 0 12px rgba(155, 89, 182, 0.3);
      --glow-mythical: 0 0 15px rgba(230, 126, 34, 0.4);
      --glow-legendary: 0 0 18px rgba(241, 196, 15, 0.5);
      --glow-catgendary: 0 0 25px rgba(255, 0, 127, 0.7);

      --grad-mythical: linear-gradient(135deg, #e67e22 0%, #ffbb88 100%);
      --grad-legendary: linear-gradient(135deg, #f1c40f 0%, #fff7cc 100%);
      --grad-catgendary: linear-gradient(135deg, #ff007f 0%, #ff99cc 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle, var(--bg-light) 0%, var(--bg-dark) 100%);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    header p {
      color: var(--subtext);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid transparent;
      display: flex;
      flex-direction: column;
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.3), 
        0 2px 4px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card.common { border-color: var(--common); }
    .card.uncommon { border-color: var(--uncommon); }
    .card.rare { border-color: var(--rare); box-shadow: var(--glow-rare); }
    .card.epic { border-color: var(--epic); box-shadow: var(--glow-epic); }
    .card.mythical { border-color: var(--mythical); box-shadow: var(--glow-mythical); }
    .card.legendary { border-color: var(--legendary); box-shadow: var(--glow-legendary); }
    .card.catgendary { border-color: var(--catgendary); box-shadow: var(--glow-catgendary); }

    .image-container {
      width: 100%;
      height: 260px;
      position: relative;
      background-color: #16181d;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .image-container img {
      transform: scale(1.03);
    }

    .badge {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
    }

    .badge.common { background-color: rgba(160, 160, 160, 0.8); color: #111; }
    .badge.uncommon { background-color: rgba(46, 204, 113, 0.8); color: #111; }
    .badge.rare { background-color: rgba(52, 152, 219, 0.8); }
    .badge.epic { background-color: rgba(155, 89, 182, 0.8); }
    .badge.mythical { background: var(--grad-mythical); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .badge.legendary { background: var(--grad-legendary); color: #111; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .badge.catgendary { background: var(--grad-catgendary); color: #fff; text-shadow: 0 0 4px rgba(0, 0, 0, 0.5); box-shadow: 0 3px 12px rgba(255, 0, 127, 0.4); }

    .content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tea-name {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .price {
      font-size: 0.95rem;
      color: var(--subtext);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .price span {
      color: #fff;
      font-weight: 700;
    }

    /* STG Accordion Styles */
    .stg-toggle-btn {
      width: 100%;
      background: #2a2f38;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .stg-toggle-btn:hover {
      background: #343a46;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .stg-container {
      display: none;
      margin-top: 10px;
      background: #17191d;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stg-container.open {
      display: block;
    }

    .grade-row {
      margin-bottom: 6px;
    }

    .grade-row:last-child {
      margin-bottom: 0;
    }

    .grade-main-btn {
      width: 100%;
      background: #22262e;
      color: var(--text);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease;
    }

    .grade-main-btn:hover {
      background: #2c323d;
      color: #fff;
    }

    .subgrade-list {
      display: none;
      padding: 6px 8px;
      background: #111316;
      border-radius: 6px;
      margin-top: 4px;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .subgrade-list.open {
      display: grid;
    }

    .subgrade-item {
      background: #1d2128;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-align: center;
      color: var(--subtext);
    }

    .subgrade-item strong {
      color: #fff;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍵 SpecialTea Ratings</h1>
    <p>A collection of my favorite teas ranked by rarity and market price.</p>
  </header>

  <main class="grid" id="tea-grid"></main>

  <script>
    const rankPriority = {
      "catgendary": 7,
      "legendary": 6,
      "mythical": 5,
      "mythic": 5,
      "epic": 4,
      "rare": 3,
      "uncommon": 2,
      "common": 1
    };

    // Multipliers relative to Grade 6 (1.0x)
    const baseMultipliers = {
      10: 3.5,
      9: 2.0,
      8: 1.5,
      7: 1.2,
      6: 1.0,
      5: 1 / 1.2,
      4: 1 / 1.5,
      3: 1 / 2.0,
      2: 1 / 3.5,
      1: 1 / 5.0
    };

    // Calculate exact multiplier including decimals
    function getGradeMultiplier(grade) {
      const lowerGrade = Math.floor(grade);
      const upperGrade = Math.min(10, lowerGrade + 1);
      const fraction = grade - lowerGrade;

      if (lowerGrade === 10) return baseMultipliers[10];

      const lowerMult = baseMultipliers[lowerGrade];
      const upperMult = baseMultipliers[upperGrade];

      return lowerMult + (upperMult - lowerMult) * fraction;
    }

    const teaData = [
      { image: "1.png", name: "Madame Grey", rarity: "legendary", price: 9, priority: 1 },
      { image: "2.png", name: "Yogi Tea Throat Comfort", rarity: "mythical", price: 7, priority: 2 },
      { image: "3.png", name: "Salbei Tee", rarity: "epic", price: 5, priority: 4 },
      { image: "4.png", name: "Kamille Salbei Tee", rarity: "rare", price: 4, priority: 5 },
      { image: "5.png", name: "Apple Cinnamon Raisin Tea", rarity: "rare", price: 4, priority: 6 },
      { image: "6.png", name: "Zen Infusion", rarity: "epic", price: 6, priority: 1 },
      { image: "7.png", name: "Bamboo Tea Pomegranate", rarity: "epic", price: 5, priority: 3 },
      { image: "8.png", name: "Bamboo Tea Bamboo", rarity: "epic", price: 6, priority: 2 },
      { image: "9.png", name: "Groene Thee Ginseng", rarity: "rare", price: 5, priority: 1 },
      { image: "10.png", name: "Rooibos Vanille", rarity: "catgendary", price: 10, priority: 1 },
      { image: "11.png", name: "Kamillen Tee", rarity: "epic", price: 9, priority: 1 },
      { image: "12.png", name: "Classic Chai", rarity: "mythical", price: 8, priority: 1 },
      { image: "13.png", name: "Salbei Ingwer", rarity: "rare", price: 6, priority: 1 },
      { image: "14.png", name: "Hanhen Klee Thee", rarity: "rare", price: 5, priority: 1 },
      { image: "15.png", name: "Rooibos Sahne Karamell", rarity: "epic", price: 7, priority: 1 },
      { image: "16.png", name: "Italienische Limone", rarity: "rare", price: 5, priority: 1 },
      { image: "17.png", name: "Grüner Tee Orange Ingwer", rarity: "epic", price: 6, priority: 1 }
    ];

    teaData.sort((a, b) => {
      const rankA = rankPriority[a.rarity.toLowerCase()] || 0;
      const rankB = rankPriority[b.rarity.toLowerCase()] || 0;

      if (rankB !== rankA) return rankB - rankA;
      if (b.price !== a.price) return b.price - a.price;
      return (a.priority || 0) - (b.priority || 0); 
    });

    const container = document.getElementById('tea-grid');

    teaData.forEach((tea, cardIndex) => {
      const card = document.createElement('div');
      card.className = `card ${tea.rarity.toLowerCase()}`;

      // Build STG Grade rows
      let stgRowsHtml = '';
      for (let g = 10; g >= 1; g--) {
        const mainPrice = Math.round(tea.price * getGradeMultiplier(g));
        
        let subgradeItemsHtml = '';
        if (g < 10) {
          for (let d = 1; d <= 9; d++) {
            const decGrade = parseFloat((g + d / 10).toFixed(1));
            const decPrice = Math.round(tea.price * getGradeMultiplier(decGrade));
            subgradeItemsHtml += `
              <div class="subgrade-item">
                <span>g${decGrade}</span>
                <strong>${decPrice} SC</strong>
              </div>
            `;
          }
        }

        stgRowsHtml += `
          <div class="grade-row">
            <button class="grade-main-btn" onclick="toggleSubgrade(this)">
              <span>Grade ${g}</span>
              <strong>${mainPrice} SC ${g < 10 ? '▾' : ''}</strong>
            </button>
            ${g < 10 ? `<div class="subgrade-list">${subgradeItemsHtml}</div>` : ''}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="image-container">
          <img src="${tea.image}" alt="${tea.name}" onerror="this.src='https://via.placeholder.com/300x300?text=Tea+Image'">
          <span class="badge ${tea.rarity.toLowerCase()}">${tea.rarity}</span>
        </div>
        <div class="content">
          <h2 class="tea-name">${tea.name}</h2>
          <div class="price">
            💰 Base Price: <span>${tea.price} SC</span>
          </div>
          
          <button class="stg-toggle-btn" onclick="toggleSTG(this)">
            <span>STG Prices</span>
            <span>▼</span>
          </button>
          
          <div class="stg-container">
            ${stgRowsHtml}
          </div>
        </div>
      `;

      container.appendChild(card);
    });

    // Toggle main STG Accordion
    function toggleSTG(btn) {
      const container = btn.nextElementSibling;
      const isOpen = container.classList.contains('open');

      // Close all main STG containers
      document.querySelectorAll('.stg-container').forEach(c => c.classList.remove('open'));
      document.querySelectorAll('.stg-toggle-btn span:last-child').forEach(s => s.textContent = '▼');

      if (!isOpen) {
        container.classList.add('open');
        btn.querySelector('span:last-child').textContent = '▲';
      }
    }

    // Toggle sub-grade decimal accordions
    function toggleSubgrade(btn) {
      const list = btn.nextElementSibling;
      if (!list) return; // Grade 10 has no subgrades

      const isOpen = list.classList.contains('open');

      // Close all open subgrade lists on the page
      document.querySelectorAll('.subgrade-list').forEach(l => l.classList.remove('open'));

      if (!isOpen) {
        list.classList.add('open');
      }
    }
  </script>
</body>
</html>
