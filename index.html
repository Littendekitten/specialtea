<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecialTea Ratings</title>
  <style>
    :root {
      --bg: #121417;
      --card-bg: #1e2229;
      --text: #e0e6ed;
      --subtext: #9da8b6;

      /* Tier Colors */
      --common: #a0a0a0;
      --uncommon: #2ecc71;
      --rare: #3498db;
      --epic: #9b59b6;
      --mythical: #e67e22;
      --legendary: #f1c40f;
      --catgendary: #ff007f; /* Vibrant magenta for Catgendary */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--subtext);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    /* Dynamic Border Colors based on Rarity */
    .card.common { border-color: var(--common); }
    .card.uncommon { border-color: var(--uncommon); }
    .card.rare { border-color: var(--rare); }
    .card.epic { border-color: var(--epic); }
    .card.mythical { border-color: var(--mythical); }
    .card.legendary { border-color: var(--legendary); }
    .card.catgendary { 
      border-color: var(--catgendary); 
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    .image-container {
      width: 100%;
      height: 200px;
      position: relative;
      background-color: #16181d;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
    }

    .badge.common { background-color: var(--common); color: #111; }
    .badge.uncommon { background-color: var(--uncommon); color: #111; }
    .badge.rare { background-color: var(--rare); }
    .badge.epic { background-color: var(--epic); }
    .badge.mythical { background-color: var(--mythical); }
    .badge.legendary { background-color: var(--legendary); color: #111; }
    .badge.catgendary { background-color: var(--catgendary); color: #fff; text-shadow: 0 0 4px #000; }

    .content {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .tea-name {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .price {
      font-size: 0.95rem;
      color: var(--subtext);
      font-weight: 500;
    }

    .price span {
      color: #2ecc71;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍵 SpecialTea Ratings</h1>
    <p>A collection of my favorite teas ranked by rarity and market price.</p>
  </header>

  <main class="grid" id="tea-grid"></main>

  <script>
    // Priority map for sorting ranks automatically
    const rankPriority = {
      "catgendary": 7,
      "legendary": 6,
      "mythical": 5,
      "mythic": 5,
      "epic": 4,
      "rare": 3,
      "uncommon": 2,
      "common": 1
    };

    // ==========================================
    // EDIT YOUR TEAS HERE VERY EASILY!
    // Rarity options: "catgendary", "legendary", "mythical", "epic", "rare", "uncommon", "common"
    // ==========================================
    const teaData = [
      {
        image: "1.png",
        name: "Madame Grey",
        rarity: "legendary",
        price: 9,
        priority: 1
      },
      {
        image: "2.png",
        name: "Yogi Tea Throat Comfort",
        rarity: "mythical",
        price: 7,
        priority: 2
      },
      {
        image: "3.png",
        name: "Salbei Tee",
        rarity: "epic",
        price: 5,
        priority: 4
      },
      {
        image: "4.png",
        name: "Kamille Salbei Tee",
        rarity: "rare",
        price: 4,
        priority: 5
      },
      {
        image: "5.png",
        name: "Apple Cinnamon Raisin Tea",
        rarity: "rare",
        price: 4,
        priority: 6
      },
      {
        image: "6.png",
        name: "Zen Infusion",
        rarity: "epic",
        price: 6,
        priority: 1 // Placed before Bamboo Tea Bamboo
      },
      {
        image: "7.png",
        name: "Bamboo Tea Pomegranate",
        rarity: "epic",
        price: 5,
        priority: 3
      },
      {
        image: "8.png",
        name: "Bamboo Tea Bamboo",
        rarity: "epic",
        price: 6,
        priority: 2 // Placed right under Zen Infusion
      },
      {
        image: "9.png",
        name: "Groene Thee Ginseng",
        rarity: "rare",
        price: 5,
        priority: 1
      },
      {
        image: "10.png",
        name: "Rooibos Vanille",
        rarity: "catgendary",
        price: 10,
        priority: 1
      },
      {
        image: "11.png",
        name: "Kamillen Tee",
        rarity: "epic",
        price: 9,
        priority: 1
      },
      {
        image: "12.png",
        name: "Classic Chai",
        rarity: "mythical",
        price: 8,
        priority: 1
      },
      {
        image: "13.png",
        name: "Salbei Ingwer",
        rarity: "rare",
        price: 6,
        priority: 1
      }
    ];

    // Auto-sort teas:
    // 1. Highest rank tier (Catgendary > Legendary > Mythical > Epic > Rare...)
    // 2. Highest price (SC)
    // 3. Custom priority (Tie-breaker for same rank and same price)
    teaData.sort((a, b) => {
      const rankA = rankPriority[a.rarity.toLowerCase()] || 0;
      const rankB = rankPriority[b.rarity.toLowerCase()] || 0;

      if (rankB !== rankA) {
        return rankB - rankA; // Highest rank tier top
      }
      if (b.price !== a.price) {
        return b.price - a.price; // Highest price top
      }
      return (a.priority || 0) - (b.priority || 0); // Tie-breaker priority
    });

    // Render sorted tea cards automatically
    const container = document.getElementById('tea-grid');

    teaData.forEach(tea => {
      const card = document.createElement('div');
      card.className = `card ${tea.rarity.toLowerCase()}`;

      card.innerHTML = `
        <div class="image-container">
          <img src="${tea.image}" alt="${tea.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Tea+Image'">
          <span class="badge ${tea.rarity.toLowerCase()}">${tea.rarity}</span>
        </div>
        <div class="content">
          <h2 class="tea-name">${tea.name}</h2>
          <div class="price">Market Price: <span>${tea.price} SC</span></div>
        </div>
      `;

      container.appendChild(card);
    });
  </script>
</body>
</html>
